name: Build Qihoo 360T7 - Kiddin9 Kwrt 25.12

on:
  push:
    branches:
      - 360t7-25.12
    paths:
      - ".github/workflows/build-360t7-25.12.yml"
      - "devices/360t7-25.12/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-360t7-25.12
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  KWRT_REPO: https://github.com/Kiddin9/Kwrt
  KWRT_BRANCH: "25.12"
  OPENWRT_REPO: https://github.com/openwrt/openwrt
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    name: Build 360T7 firmware and packages from Kiddin9 Kwrt
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            python3-yaml rsync swig unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler libpython3-dev libfuse-dev \
            libgmp3-dev libmpc-dev qemu-utils dwarves llvm aria2 jq rename \
            ccache
          sudo apt-get clean

      - name: Clone Kiddin9 Kwrt 25.12 build definitions
        run: |
          git clone --depth 1 --branch "${KWRT_BRANCH}" "${KWRT_REPO}" kwrt-config
          echo "Kiddin9 Kwrt branch: ${KWRT_BRANCH}" | tee kwrt-version.txt
          echo "Kiddin9 Kwrt commit: $(git -C kwrt-config rev-parse HEAD)" | tee -a kwrt-version.txt

      - name: Clone OpenWrt base used by Kiddin9 Kwrt
        run: |
          git clone --depth 1 --branch "${OPENWRT_BRANCH}" "${OPENWRT_REPO}" openwrt
          echo "OpenWrt base branch: ${OPENWRT_BRANCH}" | tee source-version.txt
          echo "OpenWrt base commit: $(git -C openwrt rev-parse HEAD)" | tee -a source-version.txt
          cp -a kwrt-config/devices openwrt/

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          sudo docker image prune -af || true
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir

      - name: Apply Kiddin9 Kwrt customizations and feeds
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          echo "src-git homeproxy https://github.com/immortalwrt/homeproxy.git" >> feeds.conf.default

          git_clone_path() {
            local branch="$1" repo="$2"
            shift 2
            local mode="copy"
            if [[ "${1:-}" == "mv" ]]; then
              mode="move"
              shift
            fi
            local rootdir="$PWD"
            local tmpdir
            tmpdir="$(mktemp -d)"
            git clone --depth 1 --filter=blob:none --sparse --branch "$branch" "$repo" "$tmpdir/repo"
            git -C "$tmpdir/repo" sparse-checkout set "$@"
            for path in "$@"; do
              mkdir -p "$rootdir/$path"
              cp -rn "$tmpdir/repo/$path/." "$rootdir/$path/"
            done
            rm -rf "$tmpdir"
          }
          export -f git_clone_path

          chmod +x devices/common/diy.sh devices/mediatek_filogic/diy.sh
          /bin/bash devices/common/diy.sh
          /bin/bash devices/mediatek_filogic/diy.sh

          # Apply the shared Kiddin9 Kwrt patches together with the
          # target-specific ones. The shared set is required, e.g.
          # kernel-defaults.patch makes the kernel run `make olddefconfig` before
          # compiling (otherwise it prompts for new symbols and aborts) and
          # autoreconf.patch sets PKG_FIXUP:=autoreconf for libnftnl.
          # LINUX_VERSION.patch is intentionally skipped so the OPKG feed keeps
          # the standard bin/packages layout used by the publish steps below.
          cp -rn devices/common/patches/. devices/mediatek_filogic/patches/
          rm -f devices/mediatek_filogic/patches/LINUX_VERSION.patch

          find "devices/mediatek_filogic/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | \
            xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/mediatek_filogic/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | \
            xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

          ./scripts/feeds update homeproxy
          ./scripts/feeds install -p homeproxy luci-app-homeproxy
          ./scripts/feeds install sing-box || true

      - name: Load 360T7 configuration and validate selected profile
        run: |
          set -euo pipefail
          cd openwrt
          cp devices/common/.config .config
          cat devices/mediatek_filogic/.config >> .config
          cat ../devices/360t7-25.12/.config >> .config
          make defconfig

          grep -q '^CONFIG_TARGET_mediatek=y$' .config
          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y$' .config
          ! grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7-ubi=y$' .config
          grep -q '^# CONFIG_USE_APK is not set$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=m$' .config
          grep -q '^CONFIG_PACKAGE_sing-box=m$' .config
          echo "Selected target profile: ordinary qihoo_360t7 (not qihoo_360t7-ubi)"
          grep -E '^(CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y|CONFIG_PACKAGE_(luci-app-homeproxy|sing-box)=m|CONFIG_USE_APK)' .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware and selected packages
        shell: bash
        run: |
          cd openwrt
          JOBS="$(($(nproc) + 1))"
          echo "Building on GitHub Actions x86_64 runner with -j${JOBS}"

          # Let OpenWrt's top-level dependency graph handle tools, the cross
          # toolchain and target/linux prepare (which merges the kernel config).
          # Invoking target/linux/compile directly skips the kernel olddefconfig
          # step and makes the kernel prompt for new symbols, breaking syncconfig.
          make -j"${JOBS}" V=s

      - name: Generate and verify OPKG package indexes
        run: |
          set -eux
          cd openwrt
          make package/index
          test -d bin/packages
          find bin/packages -type f -name 'Packages.gz' -print
          find bin/packages -type f -name 'Packages.gz' | grep -q .
          find bin/packages -type f -name '*homeproxy*.ipk' | grep -q .
          find bin/packages -type f -name 'sing-box*.ipk' | grep -q .
          find bin/packages -type f \( -name 'kmod-mt76-core*.ipk' -o -name 'kmod-mt7915e*.ipk' \) | grep -q .
          grep -q '^# CONFIG_USE_APK is not set$' .config
          printf '%s\\n' \
            'Qihoo 360T7 - Kiddin9 Kwrt 25.12 OPKG package feed' \
            'This repository is generated by the successful GitHub Actions firmware build.' \
            'Only install kernel modules on a router running this exact firmware build.' \
            'Feed layout: architecture/feed-name/Packages.gz and matching IPK files.' \
            > bin/packages/FEED-INFO.txt
          mkdir -p ../build-metadata
          cp .config ../build-metadata/360t7.config
          cp ../source-version.txt ../build-metadata/
          cp ../kwrt-version.txt ../build-metadata/
          find bin/targets/mediatek/filogic bin/packages -type f -print0 | \
            sort -z | xargs -0 sha256sum > ../build-metadata/SHA256SUMS.txt
          find bin/packages -maxdepth 3 -type f \( -name 'Packages.gz' -o -name 'Packages' \) -print | sort > ../build-metadata/package-indexes.txt

      - name: Upload 360T7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: Kiddin9-Kwrt-25.12-360T7-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPK package repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiddin9-Kwrt-25.12-360T7-packages-IPK
          path: openwrt/bin/packages/
          if-no-files-found: error
          retention-days: 30

      - name: Publish OPKG feed to packages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: packages
          publish_dir: ./openwrt/bin/packages
          force_orphan: true
          commit_message: "Publish 360T7 Kwrt 25.12 OPKG feed from ${{ github.sha }}"

      - name: Upload build configuration and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Kiddin9-Kwrt-25.12-360T7-build-metadata
          path: build-metadata/
          if-no-files-found: error
          retention-days: 90
