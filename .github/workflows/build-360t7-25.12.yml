name: Build Qihoo 360T7 - Kwrt 25.12

on:
  push:
    branches:
      - 360t7-25.12
    paths:
      - ".github/workflows/build-360t7-25.12.yml"
      - "devices/360t7-25.12/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-360t7-25.12
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  OPENWRT_REPO: https://github.com/openwrt/openwrt
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    name: Build 360T7 firmware and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            python3-yaml rsync swig unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler libpython3-dev libfuse-dev \
            libgmp3-dev libmpc-dev qemu-utils
          sudo apt-get clean

      - name: Clone OpenWrt 25.12 source
        run: |
          git clone --depth 1 --branch "${OPENWRT_BRANCH}" "${OPENWRT_REPO}" openwrt
          cd openwrt
          echo "OpenWrt source commit: $(git rev-parse HEAD)" | tee ../source-version.txt

      - name: Add HomeProxy feed and install feeds
        run: |
          cd openwrt
          echo "src-git kiddin9 https://github.com/kiddin9/op-packages.git;main" >> feeds.conf.default
          echo "src-git homeproxy https://github.com/immortalwrt/homeproxy.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p homeproxy luci-app-homeproxy

      - name: Load 360T7 configuration
        run: |
          cp devices/360t7-25.12/.config openwrt/.config
          cd openwrt
          make defconfig
          grep -E '^(CONFIG_TARGET_mediatek=y|CONFIG_TARGET_mediatek_filogic=y|CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7(-ubi)?=y|CONFIG_USE_APK=n|CONFIG_PACKAGE_(luci-app-homeproxy|sing-box)=m)' .config
          grep -q '^CONFIG_USE_APK=n$' .config
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7-ubi=y$' .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware and selected packages
        run: |
          cd openwrt
          NPROC="$(nproc)"
          JOBS="$((NPROC > 2 ? NPROC - 1 : 1))"
          echo "Building with -j${JOBS}"
          make -j"${JOBS}" V=s

      - name: Verify firmware and IPK packages
        run: |
          set -eux
          cd openwrt
          test -d bin/targets/mediatek/filogic
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -print
          find bin/packages -type f \( -name '*homeproxy*.ipk' -o -name 'sing-box*.ipk' \) -print
          find bin/packages -type f -name '*.ipk' | grep -q .
          grep -q '^CONFIG_USE_APK=n$' .config
          mkdir -p ../build-metadata
          cp .config ../build-metadata/360t7.config
          cp ../source-version.txt ../build-metadata/
          find bin/targets/mediatek/filogic bin/packages -type f -print0 | \
            sort -z | xargs -0 sha256sum > ../build-metadata/SHA256SUMS.txt

      - name: Upload 360T7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: Kwrt-25.12-360T7-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPK package repository
        uses: actions/upload-artifact@v4
        with:
          name: Kwrt-25.12-360T7-packages-IPK
          path: openwrt/bin/packages/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build configuration and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Kwrt-25.12-360T7-build-metadata
          path: build-metadata/
          if-no-files-found: error
          retention-days: 90
